{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">ক্যাটাগরি: <span class="text-primary">{{ category.name }}</span></h2>
    <div class="row">
        {% for post in posts %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.content|truncatewords:20 }}</p>
                    <a href="{% url 'post-detail' post.pk %}" class="btn btn-sm btn-dark">বিস্তারিত পড়ুন</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-warning">এই ক্যাটাগরিতে এখনো কোনো পোস্ট করা হয়নি!</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
