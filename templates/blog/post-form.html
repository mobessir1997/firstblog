{% extends 'base.html' %}

{% block title %}পোস্ট ফর্ম -  My Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4 my-4 bg-white rounded">
            <h3 class="mb-3 text-secondary">
                {% if 'edit' in request.path %}✏ ব্লগ পোস্ট আপডেট করুন{% else %}✍ নতুন ব্লগ পোস্ট লিখুন{% endif %}
            </h3>
            <hr>
            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary px-4">সংরক্ষণ করুন (Save)</button>
                    <a href="{% url 'blog-home' %}" class="btn btn-outline-secondary ms-2">বাতিল করুন</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    var elements = document.querySelectorAll('input, textarea, select');
    for (var i = 0; i < elements.length; i++) {
        elements[i].classList.add('form-control');
    }
</script>
{% endblock %}
