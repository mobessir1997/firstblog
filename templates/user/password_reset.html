{% extends 'base.html' %}
{% block title %}পাসওয়ার্ড রিসেট{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4 mt-5 bg-white rounded">
            <h3 class="mb-3 text-center text-primary">পাসওয়ার্ড রিসেট করুন</h3>
            <p class="text-muted small text-center">আপনার অ্যাকাউন্টের ইমেইল এড্রেসটি দিন। আমরা সেখানে পাসওয়ার্ড পরিবর্তনের একটি লিঙ্ক পাঠিয়ে দেব।</p>
            <hr>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100 mt-2">ইমেইল পাঠান</button>
            </form>
        </div>
    </div>
</div>
<script>
    document.querySelector('input[type="email"]').classList.add('form-control');
</script>
{% endblock %}
