{% extends 'base.html' %}

{% block title %}নতুন পাসওয়ার্ড সেট করুন{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4 mt-5 bg-white rounded">
            <h3 class="mb-3 text-center text-success">নতুন পাসওয়ার্ড দিন</h3>
            <hr>
            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <div class="form-text text-muted" style="font-size: 0.8em;">{{ field.help_text }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <button type="submit" class="btn btn-success w-100 mt-3">পাসওয়ার্ড নিশ্চিত করুন</button>
            </form>
        </div>
    </div>
</div>

<script>
    var inputs = document.getElementsByTagName('input');
    for (var i = 0; i < inputs.length; i++) {
        inputs[i].classList.add('form-control');
    }
</script>
{% endblock %}
